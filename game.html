<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression Game</title>
    <link rel="stylesheet" href="introduction.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/progressbar.js"></script> 
</head>
<body>
    <div class="container">
        <h1 id="phaseTitle">Data Collection Phase</h1>
        <hr/>
        <div id="controls">
            <p id="message">The linear regression algorithm needs labelled data from previous students to learn a model from. 
                <br/>João did a survey and collected the number of hours students studied last semester (our feature) and their corresponding correct answers (our label).</p>
            <button id="collectDataBtn">Collect Data</button>
        </div>
        <div id="predictions"></div>
        <br>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="progressBars" class="progress-bar-container"></div> 
    </div>
    <script src="script.js"></script>
</body>
</html>
